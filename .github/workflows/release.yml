name: Release

# main publishes ghcr.io/<owner>/spillway:edge. A version tag (v1.2.3) publishes 1.2.3, 1.2 and
# latest and opens a GitHub release. Every image is built for amd64 and arm64, carries an SBOM and
# build provenance, and is signed with Sigstore: keyless, so the signature is bound to this
# workflow's identity and there is no long-lived key to steal. The only credential is the
# workflow's own short-lived GITHUB_TOKEN.
on:
  push:
    branches: [main]
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    with:
      skip_image: true

  publish:
    name: Publish the signed image
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # the GitHub release for version tags
      packages: write # push to ghcr.io
      id-token: write # keyless signing through Sigstore
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag matches apps/server/package.json
        if: github.ref_type == 'tag'
        run: |
          version="v$(node -p "require('./apps/server/package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in apps/server/package.json"
            exit 1
          fi

      - name: Image name (registries want lower case)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=edge,branch=main
          labels: |
            org.opencontainers.image.title=Spillway
            org.opencontainers.image.description=Self-hosted AI gateway: a key per person, budgets, a local-model fallback and a masked request log

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - name: Publish the GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          cat > notes.md <<'NOTES'
          ## Run it

          ```sh
          curl -fsSLO https://github.com/@REPO@/releases/download/@TAG@/docker-compose.yml
          SPILLWAY_TAG=@VERSION@ docker compose up -d
          ```

          Image `@IMAGE@:@VERSION@` for linux/amd64 and linux/arm64, digest `@DIGEST@`.

          ## Verify it

          The image is signed by this repository's release workflow through Sigstore, with no
          long-lived signing key:

          ```sh
          cosign verify @IMAGE@:@VERSION@ \
            --certificate-identity https://github.com/@REPO@/.github/workflows/release.yml@refs/tags/@TAG@ \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          ```

          It also carries an SBOM and build provenance:
          `docker buildx imagetools inspect @IMAGE@:@VERSION@ --format "{{ json .Provenance }}"`
          NOTES
          sed -i \
            -e "s|@REPO@|$GITHUB_REPOSITORY|g" -e "s|@TAG@|$GITHUB_REF_NAME|g" \
            -e "s|@VERSION@|$version|g" -e "s|@IMAGE@|$IMAGE|g" -e "s|@DIGEST@|$DIGEST|g" notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Spillway $version" \
            --notes-file notes.md --generate-notes docker-compose.yml
