name: spillway

services:
  spillway:
    # Signed release images; pin a version with SPILLWAY_TAG=0.3.1 in .env.
    # To build from this checkout instead, see docker-compose.build.yml.
    image: ghcr.io/artemy-and/spillway:${SPILLWAY_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${SPILLWAY_PORT:-8080}:8080"
    env_file:
      - path: .env
        required: false
    volumes:
      - spillway-data:/data
    # Lets Spillway reach Ollama running on the host (Docker Desktop has this built in).
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Optional local models: docker compose --profile ollama up -d
  # then set OLLAMA_URL=http://ollama:11434 in .env before the first start.
  ollama:
    image: ollama/ollama:latest
    profiles: [ollama]
    restart: unless-stopped
    environment:
      # Claude Code and Codex send 10–30k tokens a request; at its default of 4096 Ollama
      # silently drops the start of the prompt.
      OLLAMA_CONTEXT_LENGTH: 32768
    volumes:
      - ollama-data:/root/.ollama

volumes:
  spillway-data:
  ollama-data:
