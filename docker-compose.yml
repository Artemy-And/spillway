name: spillway

services:
  spillway:
    build: .
    image: spillway:local
    restart: unless-stopped
    ports:
      - "${SPILLWAY_PORT:-8080}:8080"
    env_file:
      - path: .env
        required: false
    volumes:
      - spillway-data:/data

  # Optional local models: docker compose --profile ollama up -d
  # then set OLLAMA_URL=http://ollama:11434 in .env before the first start.
  ollama:
    image: ollama/ollama:latest
    profiles: [ollama]
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama

volumes:
  spillway-data:
  ollama-data:
